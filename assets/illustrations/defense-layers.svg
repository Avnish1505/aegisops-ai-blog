<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Three layers stop a poisoned retrieval snippet: system prompt constraints, Pydantic JSON validation, and scenario-grounded policy validation, with human approval at the core">
  <defs><marker id="dl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B5563B"/></marker></defs>
  <g font-family="'Instrument Sans','Helvetica Neue',Arial,sans-serif">
    <circle cx="200" cy="158" r="136" fill="#E4ECF4"/>
    <circle cx="200" cy="158" r="100" fill="#E7E6EF"/>
    <circle cx="200" cy="158" r="64" fill="#E3E9D9"/>
    <circle cx="200" cy="158" r="34" fill="#141413"/>
    <text x="200" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="#FAF9F5">Human</text>
    <text x="200" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#3F6E99">1</text>
    <text x="200" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#5E5A82">2</text>
    <text x="200" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#56663F">3</text>

    <g transform="translate(18 10)">
      <path d="M0 0 H34 L46 12 V58 H0 Z" fill="#FAF9F5" stroke="#B5563B" stroke-width="1.4"/>
      <path d="M34 0 V12 H46" fill="none" stroke="#B5563B" stroke-width="1.4"/>
      <line x1="8" y1="24" x2="38" y2="24" stroke="#B5563B" stroke-width="2"/><line x1="8" y1="34" x2="32" y2="34" stroke="#B5563B" stroke-width="2"/><line x1="8" y1="44" x2="36" y2="44" stroke="#B5563B" stroke-width="2"/>
    </g>
    <path d="M68 36 C 88 44, 100 58, 108 76" fill="none" stroke="#B5563B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#dl-a)"/>
    <text x="10" y="88" font-size="11.5" fill="#8E3F29">poisoned</text><text x="10" y="102" font-size="11.5" fill="#8E3F29">snippet</text>

    <g font-size="15" fill="#141413">
      <circle cx="398" cy="62" r="13" fill="#6A9BCC"/><text x="398" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#FAF9F5">1</text>
      <text x="422" y="67" font-weight="600">System prompt constraints</text>
      <circle cx="398" cy="122" r="13" fill="#8B88A8"/><text x="398" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#FAF9F5">2</text>
      <text x="422" y="127" font-weight="600">Pydantic JSON validation</text>
      <circle cx="398" cy="182" r="13" fill="#788C5D"/><text x="398" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#FAF9F5">3</text>
      <text x="422" y="187" font-weight="600">Scenario-grounded policy validation</text>
      <circle cx="398" cy="242" r="13" fill="#141413"/><circle cx="398" cy="242" r="4" fill="#D97757"/>
      <text x="422" y="247" font-weight="600">Human approval</text>
