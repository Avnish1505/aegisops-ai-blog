<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Roadmap: Phase 2 production identity and RBAC; Phase 3 structured LLM output and a constrained multi-agent adapter; Phase 4 observability, rate limiting and WAF, load and security testing, and research publication">
