<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-label="Fallback logic: if the API key is missing the engine returns blocked immediately; otherwise it calls NVIDIA NIM, and on HTTP or validation failure retries once before returning blocked with NIM_DECISION_UNAVAILABLE; valid output becomes an advisory for human review">
  <defs><marker id="fb-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A877D"/></marker></defs>
  <g font-family="'Instrument Sans','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#141413">
    <rect x="60" y="10" width="220" height="44" rx="12" fill="#E4ECF4" stroke="#6A9BCC"/>
    <text x="170" y="37" text-anchor="middle" font-weight="600">llm_rag engine called</text>
    <line x1="170" y1="54" x2="170" y2="80" stroke="#8A877D" stroke-width="1.5" marker-end="url(#fb-a)"/>

    <path d="M170 84 L280 120 L170 156 L60 120 Z" fill="#FAF9F5" stroke="#3D3D3A" stroke-width="1.3"/>
    <text x="170" y="118" text-anchor="middle" font-size="12" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">NVIDIA_API_KEY</text>
    <text x="170" y="135" text-anchor="middle" font-size="13">present?</text>
    <line x1="280" y1="120" x2="462" y2="120" stroke="#B5563B" stroke-width="1.5" marker-end="url(#fb-a)"/>
    <text x="300" y="112" font-size="12" fill="#8E3F29">no</text>
    <rect x="466" y="96" width="236" height="48" rx="12" fill="#F6E3DA" stroke="#B5563B"/>
    <text x="584" y="119" text-anchor="middle" font-weight="600" fill="#8E3F29" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">blocked</text>
    <text x="584" y="136" text-anchor="middle" font-size="12" fill="#5E5D59">immediately</text>
    <line x1="170" y1="156" x2="170" y2="184" stroke="#8A877D" stroke-width="1.5" marker-end="url(#fb-a)"/>
    <text x="180" y="176" font-size="12" fill="#56663F">yes</text>

    <rect x="60" y="188" width="220" height="48" rx="12" fill="#141413"/>
    <text x="170" y="210" text-anchor="middle" font-weight="600" fill="#FAF9F5">Call NVIDIA NIM</text>
    <text x="170" y="227" text-anchor="middle" font-size="12" fill="#D8D5CC" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">temperature=0</text>
    <line x1="170" y1="236" x2="170" y2="262" stroke="#8A877D" stroke-width="1.5" marker-end="url(#fb-a)"/>

    <path d="M170 266 L286 304 L170 342 L54 304 Z" fill="#FAF9F5" stroke="#3D3D3A" stroke-width="1.3"/>
    <text x="170" y="301" text-anchor="middle" font-size="13">JSON, schema and</text>
    <text x="170" y="318" text-anchor="middle" font-size="13">policy all valid?</text>
    <line x1="286" y1="304" x2="462" y2="304" stroke="#788C5D" stroke-width="1.5" marker-end="url(#fb-a)"/>
    <text x="304" y="296" font-size="12" fill="#56663F">yes</text>
    <rect x="466" y="280" width="236" height="48" rx="12" fill="#E3E9D9" stroke="#788C5D"/>
    <text x="584" y="303" text-anchor="middle" font-weight="600">Advisory result</text>
    <text x="584" y="320" text-anchor="middle" font-size="12" fill="#5E5D59">still needs human approval</text>
    <line x1="170" y1="342" x2="170" y2="368" stroke="#8A877D" stroke-width="1.5" marker-end="url(#fb-a)"/>
    <text x="180" y="360" font-size="12" fill="#8E3F29">no</text>

    <path d="M170 372 L270 406 L170 440 L70 406 Z" fill="#FAF9F5" stroke="#3D3D3A" stroke-width="1.3"/>
    <text x="170" y="411" text-anchor="middle" font-size="13">Already retried?</text>
    <path d="M70 406 L22 406 L22 212 L56 212" fill="none" stroke="#6A9BCC" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fb-a)"/>
    <text x="12" y="316" font-size="12" fill="#3F6E99" transform="rotate(-90 12 316)" text-anchor="middle">no, retry once</text>
    <line x1="270" y1="406" x2="462" y2="406" stroke="#B5563B" stroke-width="1.5" marker-end="url(#fb-a)"/>
    <text x="290" y="398" font-size="12" fill="#8E3F29">yes</text>
    <rect x="466" y="382" width="236" height="48" rx="12" fill="#F6E3DA" stroke="#B5563B"/>
    <text x="584" y="404" text-anchor="middle" font-weight="600" fill="#8E3F29" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">blocked</text>
    <text x="584" y="421" text-anchor="middle" font-size="11.5" fill="#5E5D59" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">NIM_DECISION_UNAVAILABLE</text>
  </g>
</svg>
