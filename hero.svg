<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="An untrusted LLM proposal passes through a deterministic policy shield; unsafe output is blocked and safe output goes to a human for the final decision">
  <defs>
    <pattern id="hg-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#CFCABD"/></pattern>
    <marker id="hg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3D3D3A"/></marker>
    <marker id="hg-arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#788C5D"/></marker>
    <marker id="hg-arrow-clay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B5563B"/></marker>
  </defs>
  <rect x="0" y="0" width="520" height="440" rx="28" fill="url(#hg-dots)" opacity="0.9"/>
  <g opacity="0.55">
    <circle cx="64" cy="300" r="5" fill="#D97757"/><circle cx="64" cy="300" r="13" fill="none" stroke="#D97757"/>
    <circle cx="120" cy="388" r="4" fill="#D97757"/>
    <circle cx="468" cy="330" r="5" fill="#6A9BCC"/><circle cx="440" cy="398" r="4" fill="#6A9BCC"/>
    <circle cx="150" cy="210" r="3.5" fill="#788C5D"/>
  </g>

  <g font-family="'Instrument Sans','Helvetica Neue',Arial,sans-serif">
    <rect x="22" y="36" width="168" height="72" rx="14" fill="#E4ECF4" stroke="#6A9BCC" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="40" y="66" font-size="16" font-weight="600" fill="#141413">LLM proposal</text>
    <text x="40" y="88" font-size="12.5" fill="#5E5D59" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">untrusted JSON</text>

    <path class="flow" d="M190 84 C 240 96, 230 150, 246 168" fill="none" stroke="#6A9BCC" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#hg-arrow)"/>

    <path d="M300 118 L384 148 L384 228 C384 284 348 318 300 340 C252 318 216 284 216 228 L216 148 Z" fill="#141413"/>
    <path d="M300 136 L368 160 L368 228 C368 274 339 302 300 320 C261 302 232 274 232 228 L232 160 Z" fill="none" stroke="#FAF9F5" stroke-opacity="0.22"/>
    <path d="M300 154 L352 172 L352 228 C352 264 330 286 300 300 C270 286 248 264 248 228 L248 172 Z" fill="none" stroke="#FAF9F5" stroke-opacity="0.14"/>
    <text x="300" y="196" text-anchor="middle" font-size="13" fill="#FAF9F5" opacity="0.7">deterministic</text>
    <text x="300" y="216" text-anchor="middle" font-size="17" font-weight="600" fill="#FAF9F5">policy</text>
    <g stroke="#D97757" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M270 238 l4 4 l8 -9"/><path d="M296 238 l4 4 l8 -9"/><path d="M322 238 l4 4 l8 -9"/>
      <path d="M270 262 l4 4 l8 -9"/><path d="M296 262 l4 4 l8 -9"/><path d="M322 262 l4 4 l8 -9"/>
    </g>

    <path class="flow" d="M384 176 C 420 160, 430 132, 440 118" fill="none" stroke="#B5563B" stroke-width="2" marker-end="url(#hg-arrow-clay)"/>
    <rect x="380" y="62" width="130" height="48" rx="12" fill="#F6E3DA" stroke="#B5563B" stroke-width="1.5"/>
    <circle cx="402" cy="86" r="8" fill="none" stroke="#B5563B" stroke-width="2"/><path d="M397 91 L407 81" stroke="#B5563B" stroke-width="2"/>
    <text x="418" y="91" font-size="15" font-weight="600" fill="#8E3F29" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">blocked</text>

    <path class="flow" d="M300 342 L300 370" fill="none" stroke="#788C5D" stroke-width="2.2" marker-end="url(#hg-arrow-olive)"/>
    <rect x="206" y="374" width="188" height="52" rx="14" fill="#E3E9D9" stroke="#788C5D" stroke-width="1.5"/>
    <circle cx="232" cy="394" r="6" fill="#788C5D"/><path d="M222 412 C222 403 242 403 242 412" fill="#788C5D"/>
    <text x="252" y="406" font-size="16" font-weight="600" fill="#141413">Human decides</text>
  </g>
</svg>
