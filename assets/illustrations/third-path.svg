<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-label="Three ways to use an LLM in high-stakes decisions: trust the model entirely, wrap it in a thin UI, or the third path where a structured proposal is validated against the scenario and a policy layer before a human decides">
  <defs>
    <marker id="tp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A877D"/></marker>
  </defs>
  <g font-family="'Instrument Sans','Helvetica Neue',Arial,sans-serif">
    <text x="115" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#5E5D59">Trust the model</text>
    <text x="365" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#5E5D59">Thin UI wrapper</text>
    <rect x="496" y="0" width="244" height="300" rx="18" fill="#F4DCCF" opacity="0.55"/>
    <text x="618" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#8E3F29">The third path</text>

    <g font-size="14" fill="#141413">
      <rect x="20" y="44" width="190" height="42" rx="10" fill="#E4ECF4" stroke="#6A9BCC"/><text x="115" y="70" text-anchor="middle">LLM output</text>
      <line x1="115" y1="86" x2="115" y2="206" stroke="#8A877D" stroke-width="1.5" marker-end="url(#tp-a)"/>
      <rect x="20" y="212" width="190" height="42" rx="10" fill="#F6E3DA" stroke="#B5563B"/><text x="115" y="238" text-anchor="middle">Operational decision</text>

      <rect x="270" y="44" width="190" height="42" rx="10" fill="#E4ECF4" stroke="#6A9BCC"/><text x="365" y="70" text-anchor="middle">LLM output</text>
      <line x1="365" y1="86" x2="365" y2="122" stroke="#8A877D" stroke-width="1.5" marker-end="url(#tp-a)"/>
      <rect x="270" y="128" width="190" height="42" rx="10" fill="#FAF9F5" stroke="#B0AEA5"/><text x="365" y="154" text-anchor="middle">Interface</text>
      <line x1="365" y1="170" x2="365" y2="206" stroke="#8A877D" stroke-width="1.5" marker-end="url(#tp-a)"/>
      <rect x="270" y="212" width="190" height="42" rx="10" fill="#F6E3DA" stroke="#B5563B"/><text x="365" y="238" text-anchor="middle">Operational decision</text>

      <rect x="523" y="44" width="190" height="40" rx="10" fill="#E4ECF4" stroke="#6A9BCC" stroke-dasharray="5 4"/><text x="618" y="69" text-anchor="middle">Structured proposal</text>
      <line x1="618" y1="84" x2="618" y2="100" stroke="#8A877D" stroke-width="1.5" marker-end="url(#tp-a)"/>
      <rect x="523" y="104" width="190" height="40" rx="10" fill="#FAF9F5" stroke="#3D3D3A"/><text x="618" y="129" text-anchor="middle">Scenario validation</text>
      <line x1="618" y1="144" x2="618" y2="160" stroke="#8A877D" stroke-width="1.5" marker-end="url(#tp-a)"/>
      <rect x="523" y="164" width="190" height="40" rx="10" fill="#141413"/><text x="618" y="189" text-anchor="middle" fill="#FAF9F5">Deterministic policy</text>
      <line x1="618" y1="204" x2="618" y2="220" stroke="#8A877D" stroke-width="1.5" marker-end="url(#tp-a)"/>
      <rect x="523" y="224" width="190" height="40" rx="10" fill="#E3E9D9" stroke="#788C5D"/><text x="618" y="249" text-anchor="middle">Human authority</text>
    </g>
  </g>
</svg>
