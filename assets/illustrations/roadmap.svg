    <line x1="40" y1="40" x2="720" y2="40" stroke="#DEDAD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="128" y2="40" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
    <circle cx="128" cy="40" r="11" fill="#D97757"/><circle cx="380" cy="40" r="11" fill="#FAF9F5" stroke="#6A9BCC" stroke-width="3"/><circle cx="632" cy="40" r="11" fill="#FAF9F5" stroke="#788C5D" stroke-width="3"/>
    <text x="128" y="16" text-anchor="middle" font-size="14" font-weight="700" fill="#8E3F29">Phase 2</text>
    <text x="380" y="16" text-anchor="middle" font-size="14" font-weight="700" fill="#3F6E99">Phase 3</text>
    <text x="632" y="16" text-anchor="middle" font-size="14" font-weight="700" fill="#56663F">Phase 4</text>
    <g font-size="13" font-weight="600" fill="#141413" text-anchor="middle">
      <rect x="10" y="74" width="236" height="40" rx="10" fill="#F6E3DA"/><text x="128" y="99">Production Identity and RBAC</text>
      <rect x="262" y="74" width="236" height="40" rx="10" fill="#E4ECF4"/><text x="380" y="99">Structured LLM Output</text>
      <rect x="262" y="122" width="236" height="40" rx="10" fill="#E4ECF4"/><text x="380" y="147">Constrained Multi-Agent Adapter</text>
      <rect x="514" y="74" width="236" height="40" rx="10" fill="#E3E9D9"/><text x="632" y="99">Observability</text>
      <rect x="514" y="122" width="236" height="40" rx="10" fill="#E3E9D9"/><text x="632" y="147">Rate Limiting and WAF</text>
      <rect x="514" y="170" width="236" height="40" rx="10" fill="#E3E9D9"/><text x="632" y="195">Load and Security Testing</text>
