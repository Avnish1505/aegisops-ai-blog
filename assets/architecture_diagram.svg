<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EEF3F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DCE7F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradApi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBEDE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4D9CB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradApp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F1F0F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DDDBE8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradDomain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF2E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DCE3D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradInfra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F6ECE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EBD7C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPersist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EDEBE4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEDAD0;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5E5D59"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8A877D"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="#FAF9F5"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#141413">AegisOps AI — System Architecture</text>
  <line x1="200" y1="48" x2="700" y2="48" stroke="#E3E1D8" stroke-width="1.5"/>

  <!-- ================= CLIENT LAYER ================= -->
  <rect x="50" y="65" width="800" height="90" rx="10" fill="url(#gradClient)" stroke="#A9C4DE" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="88" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#3F6E99">🖥️  Browser Client</text>

  <rect x="300" y="95" width="300" height="45" rx="8" fill="#ffffff" stroke="#6A9BCC" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="450" y="115" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#3F6E99">React Operations Console</text>
  <text x="450" y="132" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5E5D59">Vite + TypeScript + Tailwind CSS</text>

  <!-- Arrow: Client → API -->
  <line x1="450" y1="155" x2="450" y2="175" stroke="#5E5D59" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="168" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">HTTP JSON</text>

  <!-- ================= API LAYER ================= -->
  <rect x="50" y="180" width="800" height="135" rx="10" fill="url(#gradApi)" stroke="#EBB9A2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="203" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#A9533A">⚡  FastAPI Transport Layer</text>

  <!-- API boxes -->
  <rect x="70" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#E09474" stroke-width="1" filter="url(#shadow)"/>
  <text x="137" y="232" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#A9533A">CORS Middleware</text>
  <text x="137" y="246" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Origin filtering</text>

  <rect x="220" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#E09474" stroke-width="1" filter="url(#shadow)"/>
  <text x="287" y="232" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#A9533A">Security Headers</text>
  <text x="287" y="246" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">X-Request-ID</text>

  <rect x="370" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#E09474" stroke-width="1" filter="url(#shadow)"/>
  <text x="437" y="232" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#A9533A">Pydantic Validation</text>
  <text x="437" y="246" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Schema enforcement</text>

  <rect x="520" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#E09474" stroke-width="1" filter="url(#shadow)"/>
  <text x="587" y="232" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#A9533A">RBAC (Dev Tokens)</text>
  <text x="587" y="246" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Role checks</text>

  <rect x="670" y="215" width="160" height="38" rx="6" fill="#ffffff" stroke="#E09474" stroke-width="1" filter="url(#shadow)"/>
  <text x="750" y="232" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#A9533A">API Routes</text>
  <text x="750" y="246" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">/scenarios, /decisions</text>

  <!-- API internal arrows -->
  <line x1="205" y1="234" x2="220" y2="234" stroke="#B0AEA5" stroke-width="1.2" marker-end="url(#arrowDashed)"/>
  <line x1="355" y1="234" x2="370" y2="234" stroke="#B0AEA5" stroke-width="1.2" marker-end="url(#arrowDashed)"/>
  <line x1="505" y1="234" x2="520" y2="234" stroke="#B0AEA5" stroke-width="1.2" marker-end="url(#arrowDashed)"/>
  <line x1="655" y1="234" x2="670" y2="234" stroke="#B0AEA5" stroke-width="1.2" marker-end="url(#arrowDashed)"/>

  <!-- Arrow: API → App -->
  <line x1="450" y1="315" x2="450" y2="335" stroke="#5E5D59" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= APP LAYER ================= -->
  <rect x="50" y="340" width="800" height="100" rx="10" fill="url(#gradApp)" stroke="#CBCADB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="363" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#5E5A82">📦  Application Layer</text>

  <rect x="200" y="375" width="220" height="50" rx="8" fill="#ffffff" stroke="#9C99B8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="310" y="395" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#5E5A82">Scenario Service</text>
  <text x="310" y="412" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Seeded synthetic generator</text>

  <rect x="460" y="375" width="240" height="50" rx="8" fill="#ffffff" stroke="#9C99B8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="580" y="395" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#5E5A82">Ports (Protocols)</text>
  <text x="580" y="412" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">DecisionEngine · RetrievalPort</text>

  <!-- Arrow: App → Domain -->
  <line x1="450" y1="440" x2="450" y2="460" stroke="#5E5D59" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= DOMAIN LAYER ================= -->
  <rect x="50" y="465" width="800" height="100" rx="10" fill="url(#gradDomain)" stroke="#BFCBAB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="488" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#56663F">🛡️  Domain Layer</text>

  <rect x="200" y="500" width="220" height="50" rx="8" fill="#ffffff" stroke="#9AAA82" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="310" y="520" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#56663F">Pydantic Models</text>
  <text x="310" y="537" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Scenario · DecisionResult · etc.</text>

  <rect x="460" y="500" width="240" height="50" rx="8" fill="#ffffff" stroke="#9AAA82" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="580" y="520" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#56663F">Policy Engine</text>
  <text x="580" y="537" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">evaluate_safety_gates · validate_llm</text>

  <!-- Arrow: Domain → Infra -->
  <line x1="450" y1="565" x2="450" y2="585" stroke="#5E5D59" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= INFRA LAYER ================= -->
  <rect x="50" y="590" width="800" height="160" rx="10" fill="url(#gradInfra)" stroke="#D9B79E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="613" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A5A3C">⚙️  Infrastructure Layer</text>

  <rect x="70" y="625" width="230" height="55" rx="8" fill="#ffffff" stroke="#C4926F" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="185" y="645" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#8A5A3C">RuleBasedDecisionEngine</text>
  <text x="185" y="662" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Deterministic greedy baseline</text>
  <text x="185" y="675" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Sub-millisecond · No external deps</text>

  <rect x="325" y="625" width="230" height="55" rx="8" fill="#ffffff" stroke="#C4926F" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="440" y="645" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#8A5A3C">RetrievalEngine</text>
  <text x="440" y="662" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Local FAISS + Markdown corpus</text>
  <text x="440" y="675" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">BLAKE2b token hashing · Top-3 docs</text>

  <rect x="580" y="625" width="250" height="55" rx="8" fill="#ffffff" stroke="#C4926F" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="705" y="645" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#8A5A3C">LLMDecisionEngine</text>
  <text x="705" y="662" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">NVIDIA NIM adapter · JSON-only</text>
  <text x="705" y="675" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Retry once · Fallback blocked</text>

  <!-- Knowledge base box -->
  <rect x="370" y="695" width="140" height="40" rx="6" fill="#FAF4EC" stroke="#EBB9A2" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="440" y="712" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#A9533A">📚 knowledge/*.md</text>
  <text x="440" y="727" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Local corpus</text>

  <!-- Knowledge arrow -->
  <line x1="440" y1="695" x2="440" y2="680" stroke="#D97757" stroke-width="1.2" marker-end="url(#arrowDashed)"/>

  <!-- Arrow: Infra → Persistence -->
  <line x1="450" y1="750" x2="450" y2="770" stroke="#5E5D59" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="763" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">persist</text>

  <!-- ================= PERSISTENCE LAYER ================= -->
  <rect x="50" y="775" width="800" height="100" rx="10" fill="url(#gradPersist)" stroke="#C8C2B3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="798" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6353">💾  Persistence Layer</text>

  <rect x="200" y="810" width="240" height="50" rx="8" fill="#ffffff" stroke="#A79F8B" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="320" y="830" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B6353">SQLite / PostgreSQL</text>
  <text x="320" y="847" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">SQLAlchemy 2.0 · Alembic migrations</text>

  <rect x="480" y="810" width="220" height="50" rx="8" fill="#ffffff" stroke="#A79F8B" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="590" y="830" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B6353">AuditLog</text>
  <text x="590" y="847" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D">Decision · Approval · User tables</text>

  <!-- Arrow: Persistence → Audit back -->
  <path d="M 480 835 Q 460 835 460 850" stroke="#A79F8B" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>

  <!-- ================= LEGEND ================= -->
  <rect x="50" y="900" width="800" height="170" rx="10" fill="#ffffff" stroke="#E3E1D8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="925" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#3D3D3A">📋  Legend &amp; Data Flow</text>

  <!-- Legend items -->
  <rect x="70" y="940" width="18" height="12" rx="3" fill="url(#gradClient)" stroke="#A9C4DE" stroke-width="1"/>
  <text x="95" y="950" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5E5D59">Browser Client</text>

  <rect x="200" y="940" width="18" height="12" rx="3" fill="url(#gradApi)" stroke="#EBB9A2" stroke-width="1"/>
  <text x="225" y="950" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5E5D59">FastAPI Transport</text>

  <rect x="350" y="940" width="18" height="12" rx="3" fill="url(#gradApp)" stroke="#CBCADB" stroke-width="1"/>
  <text x="375" y="950" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5E5D59">Application Layer</text>

  <rect x="500" y="940" width="18" height="12" rx="3" fill="url(#gradDomain)" stroke="#BFCBAB" stroke-width="1"/>
  <text x="525" y="950" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5E5D59">Domain Layer</text>

  <rect x="630" y="940" width="18" height="12" rx="3" fill="url(#gradInfra)" stroke="#D9B79E" stroke-width="1"/>
  <text x="655" y="950" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5E5D59">Infrastructure</text>

  <rect x="70" y="965" width="18" height="12" rx="3" fill="url(#gradPersist)" stroke="#C8C2B3" stroke-width="1"/>
  <text x="95" y="975" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5E5D59">Persistence</text>

  <!-- Flow description -->
  <text x="70" y="1005" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#3D3D3A">Request Flow:</text>
  <text x="70" y="1022" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#5E5D59">① React Console → ② CORS/Security/Validation/RBAC → ③ Scenario Service &amp; Ports → ④ Pydantic Models &amp; Policy</text>
  <text x="70" y="1038" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#5E5D59">⑤ Rule Engine (default) OR LLM Engine (+ Retrieval) → ⑥ Safety Validation → ⑦ Persist to DB + AuditLog → ⑧ JSON Response</text>

  <text x="70" y="1060" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8A877D" font-style="italic">Solid arrows = synchronous calls  ·  Dashed arrows = data/query flow  ·  All decisions are advisory-only with human approval required</text>
</svg>