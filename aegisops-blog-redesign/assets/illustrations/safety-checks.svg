<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" role="img" aria-label="Each LLM assignment is checked six ways against the real scenario, unmet requirements are recomputed, and evaluate_safety_gates derives the final blocked state">
  <defs><marker id="sc-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A877D"/></marker></defs>
  <g font-family="'Instrument Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#141413">
    <rect x="8" y="94" width="142" height="62" rx="12" fill="#E4ECF4" stroke="#6A9BCC" stroke-dasharray="5 4"/>
    <text x="79" y="120" text-anchor="middle" font-weight="600">LLM</text>
    <text x="79" y="139" text-anchor="middle" font-weight="600">assignment</text>
    <line x1="150" y1="125" x2="186" y2="125" stroke="#8A877D" stroke-width="1.5" marker-end="url(#sc-a)"/>

    <rect x="190" y="8" width="318" height="234" rx="14" fill="#FAF9F5" stroke="#DEDAD0"/>
    <g>
      <circle cx="214" cy="36" r="9" fill="#E3E9D9"/><path d="M209 36 l3.5 3.5 l7 -7" stroke="#56663F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="232" y="41">Resource exists in the scenario</text>
      <circle cx="214" cy="72" r="9" fill="#E3E9D9"/><path d="M209 72 l3.5 3.5 l7 -7" stroke="#56663F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="232" y="77">Resource is available</text>
      <circle cx="214" cy="108" r="9" fill="#E3E9D9"/><path d="M209 108 l3.5 3.5 l7 -7" stroke="#56663F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="232" y="113">Type matches the requirement</text>
      <circle cx="214" cy="144" r="9" fill="#E3E9D9"/><path d="M209 144 l3.5 3.5 l7 -7" stroke="#56663F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="232" y="149">Not assigned more than once</text>
      <circle cx="214" cy="180" r="9" fill="#E3E9D9"/><path d="M209 180 l3.5 3.5 l7 -7" stroke="#56663F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="232" y="185">Within the required quantity</text>
      <circle cx="214" cy="216" r="9" fill="#E3E9D9"/><path d="M209 216 l3.5 3.5 l7 -7" stroke="#56663F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="232" y="221" font-size="12.5" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">requires_human_approval</text>
    </g>
    <line x1="508" y1="125" x2="542" y2="125" stroke="#8A877D" stroke-width="1.5" marker-end="url(#sc-a)"/>

    <rect x="546" y="46" width="186" height="54" rx="12" fill="#F0EEE6" stroke="#B0AEA5"/>
    <text x="639" y="69" text-anchor="middle" font-weight="600">Recompute unmet</text>
    <text x="639" y="87" text-anchor="middle" font-weight="600">requirements</text>
    <line x1="639" y1="100" x2="639" y2="136" stroke="#8A877D" stroke-width="1.5" marker-end="url(#sc-a)"/>
    <rect x="546" y="140" width="186" height="54" rx="12" fill="#141413"/>
    <text x="639" y="172" text-anchor="middle" font-size="12.5" fill="#FAF9F5" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">evaluate_safety_gates</text>
    <text x="639" y="222" text-anchor="middle" font-size="12.5" fill="#5E5D59">final blocked state</text>
    <line x1="639" y1="194" x2="639" y2="208" stroke="#D97757" stroke-width="2"/>
  </g>
</svg>
