<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <meta name="theme-color" content="#FAF9F5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/aegis.css' | relative_url }}">
  {%- include custom-head.html -%}
</head>
<body>
  <div class="progress" aria-hidden="true"><span></span></div>

  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20.5 5 V11.5 C20.5 16.6 17 20 12 22 C7 20 3.5 16.6 3.5 11.5 V5 Z" fill="#141413"/><path d="M8.3 12.2 l2.6 2.6 l5-5.4" stroke="#D97757" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>{{ site.title }}</span>
    </a>
    <a class="repo" href="https://github.com/Avnish1505/aegisops-ai">View the code</a>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="hero-text" id="hero-text">
        <p class="hero-kicker">{{ site.description }}</p>
        <p class="hero-meta"><span id="read-time"></span></p>
      </div>
      <figure class="hero-art" aria-hidden="false"></figure>
    </div>
  </section>

  <div class="shell">
    <nav class="toc" aria-label="Contents">
      <div class="toc-inner">
        <button class="toc-toggle" type="button" aria-expanded="false"><span>Contents</span></button>
        <p class="toc-title">Contents</p>
        <ul id="toc-list"></ul>
      </div>
    </nav>
    <article class="prose" id="prose">
      {{ content }}
    </article>
  </div>

  <footer class="site-footer">
    <div class="inner">
      <div><strong>{{ site.title }}</strong><br>{{ site.description }}</div>
      <div><a href="https://github.com/Avnish1505/aegisops-ai">github.com/Avnish1505/aegisops-ai</a></div>
    </div>
  </footer>

  <script>window.AEGIS_ILLUS_BASE = "{{ '/assets/illustrations/' | relative_url }}";</script>
  <script src="{{ '/assets/js/aegis.js' | relative_url }}" defer></script>
</body>
</html>
