<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradApi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradApp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradDomain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradInfra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPersist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b2dfdb;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#78909c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#263238">AegisOps AI — System Architecture</text>
  <line x1="200" y1="48" x2="700" y2="48" stroke="#cfd8dc" stroke-width="1.5"/>

  <!-- ================= CLIENT LAYER ================= -->
  <rect x="50" y="65" width="800" height="90" rx="10" fill="url(#gradClient)" stroke="#90caf9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="88" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#1565c0">🖥️  Browser Client</text>

  <rect x="300" y="95" width="300" height="45" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="450" y="115" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#1565c0">React Operations Console</text>
  <text x="450" y="132" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="10" fill="#546e7a">Vite + TypeScript + Tailwind CSS</text>

  <!-- Arrow: Client → API -->
  <line x1="450" y1="155" x2="450" y2="175" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="168" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">HTTP JSON</text>

  <!-- ================= API LAYER ================= -->
  <rect x="50" y="180" width="800" height="135" rx="10" fill="url(#gradApi)" stroke="#ffcc80" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="203" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#e65100">⚡  FastAPI Transport Layer</text>

  <!-- API boxes -->
  <rect x="70" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1" filter="url(#shadow)"/>
  <text x="137" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#e65100">CORS Middleware</text>
  <text x="137" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Origin filtering</text>

  <rect x="220" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1" filter="url(#shadow)"/>
  <text x="287" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#e65100">Security Headers</text>
  <text x="287" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">X-Request-ID</text>

  <rect x="370" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1" filter="url(#shadow)"/>
  <text x="437" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#e65100">Pydantic Validation</text>
  <text x="437" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Schema enforcement</text>

  <rect x="520" y="215" width="135" height="38" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1" filter="url(#shadow)"/>
  <text x="587" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#e65100">RBAC (Dev Tokens)</text>
  <text x="587" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Role checks</text>

  <rect x="670" y="215" width="160" height="38" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1" filter="url(#shadow)"/>
  <text x="750" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#e65100">API Routes</text>
  <text x="750" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">/scenarios, /decisions</text>

  <!-- API internal arrows -->
  <line x1="205" y1="234" x2="220" y2="234" stroke="#90a4ae" stroke-width="1.2" marker-end="url(#arrowDashed)"/>
  <line x1="355" y1="234" x2="370" y2="234" stroke="#90a4ae" stroke-width="1.2" marker-end="url(#arrowDashed)"/>
  <line x1="505" y1="234" x2="520" y2="234" stroke="#90a4ae" stroke-width="1.2" marker-end="url(#arrowDashed)"/>
  <line x1="655" y1="234" x2="670" y2="234" stroke="#90a4ae" stroke-width="1.2" marker-end="url(#arrowDashed)"/>

  <!-- Arrow: API → App -->
  <line x1="450" y1="315" x2="450" y2="335" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= APP LAYER ================= -->
  <rect x="50" y="340" width="800" height="100" rx="10" fill="url(#gradApp)" stroke="#ce93d8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="363" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#6a1b9a">📦  Application Layer</text>

  <rect x="200" y="375" width="220" height="50" rx="8" fill="#ffffff" stroke="#ba68c8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="310" y="395" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#6a1b9a">Scenario Service</text>
  <text x="310" y="412" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Seeded synthetic generator</text>

  <rect x="460" y="375" width="240" height="50" rx="8" fill="#ffffff" stroke="#ba68c8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="580" y="395" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#6a1b9a">Ports (Protocols)</text>
  <text x="580" y="412" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">DecisionEngine · RetrievalPort</text>

  <!-- Arrow: App → Domain -->
  <line x1="450" y1="440" x2="450" y2="460" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= DOMAIN LAYER ================= -->
  <rect x="50" y="465" width="800" height="100" rx="10" fill="url(#gradDomain)" stroke="#a5d6a7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="488" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#2e7d32">🛡️  Domain Layer</text>

  <rect x="200" y="500" width="220" height="50" rx="8" fill="#ffffff" stroke="#81c784" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="310" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#2e7d32">Pydantic Models</text>
  <text x="310" y="537" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Scenario · DecisionResult · etc.</text>

  <rect x="460" y="500" width="240" height="50" rx="8" fill="#ffffff" stroke="#81c784" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="580" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#2e7d32">Policy Engine</text>
  <text x="580" y="537" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">evaluate_safety_gates · validate_llm</text>

  <!-- Arrow: Domain → Infra -->
  <line x1="450" y1="565" x2="450" y2="585" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= INFRA LAYER ================= -->
  <rect x="50" y="590" width="800" height="160" rx="10" fill="url(#gradInfra)" stroke="#f48fb1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="613" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#c2185b">⚙️  Infrastructure Layer</text>

  <rect x="70" y="625" width="230" height="55" rx="8" fill="#ffffff" stroke="#f06292" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="185" y="645" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#c2185b">RuleBasedDecisionEngine</text>
  <text x="185" y="662" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Deterministic greedy baseline</text>
  <text x="185" y="675" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Sub-millisecond · No external deps</text>

  <rect x="325" y="625" width="230" height="55" rx="8" fill="#ffffff" stroke="#f06292" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="440" y="645" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#c2185b">RetrievalEngine</text>
  <text x="440" y="662" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Local FAISS + Markdown corpus</text>
  <text x="440" y="675" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">BLAKE2b token hashing · Top-3 docs</text>

  <rect x="580" y="625" width="250" height="55" rx="8" fill="#ffffff" stroke="#f06292" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="705" y="645" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#c2185b">LLMDecisionEngine</text>
  <text x="705" y="662" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">NVIDIA NIM adapter · JSON-only</text>
  <text x="705" y="675" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Retry once · Fallback blocked</text>

  <!-- Knowledge base box -->
  <rect x="370" y="695" width="140" height="40" rx="6" fill="#fff8e1" stroke="#ffcc80" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="440" y="712" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#e65100">📚 knowledge/*.md</text>
  <text x="440" y="727" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Local corpus</text>

  <!-- Knowledge arrow -->
  <line x1="440" y1="695" x2="440" y2="680" stroke="#ff8f00" stroke-width="1.2" marker-end="url(#arrowDashed)"/>

  <!-- Arrow: Infra → Persistence -->
  <line x1="450" y1="750" x2="450" y2="770" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="763" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">persist</text>

  <!-- ================= PERSISTENCE LAYER ================= -->
  <rect x="50" y="775" width="800" height="100" rx="10" fill="url(#gradPersist)" stroke="#80cbc4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="798" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#00695c">💾  Persistence Layer</text>

  <rect x="200" y="810" width="240" height="50" rx="8" fill="#ffffff" stroke="#4db6ac" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="320" y="830" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#00695c">SQLite / PostgreSQL</text>
  <text x="320" y="847" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">SQLAlchemy 2.0 · Alembic migrations</text>

  <rect x="480" y="810" width="220" height="50" rx="8" fill="#ffffff" stroke="#4db6ac" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="590" y="830" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#00695c">AuditLog</text>
  <text x="590" y="847" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c">Decision · Approval · User tables</text>

  <!-- Arrow: Persistence → Audit back -->
  <path d="M 480 835 Q 460 835 460 850" stroke="#4db6ac" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>

  <!-- ================= LEGEND ================= -->
  <rect x="50" y="900" width="800" height="170" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="925" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#37474f">📋  Legend &amp; Data Flow</text>

  <!-- Legend items -->
  <rect x="70" y="940" width="18" height="12" rx="3" fill="url(#gradClient)" stroke="#90caf9" stroke-width="1"/>
  <text x="95" y="950" font-family="Segoe UI, sans-serif" font-size="10" fill="#546e7a">Browser Client</text>

  <rect x="200" y="940" width="18" height="12" rx="3" fill="url(#gradApi)" stroke="#ffcc80" stroke-width="1"/>
  <text x="225" y="950" font-family="Segoe UI, sans-serif" font-size="10" fill="#546e7a">FastAPI Transport</text>

  <rect x="350" y="940" width="18" height="12" rx="3" fill="url(#gradApp)" stroke="#ce93d8" stroke-width="1"/>
  <text x="375" y="950" font-family="Segoe UI, sans-serif" font-size="10" fill="#546e7a">Application Layer</text>

  <rect x="500" y="940" width="18" height="12" rx="3" fill="url(#gradDomain)" stroke="#a5d6a7" stroke-width="1"/>
  <text x="525" y="950" font-family="Segoe UI, sans-serif" font-size="10" fill="#546e7a">Domain Layer</text>

  <rect x="630" y="940" width="18" height="12" rx="3" fill="url(#gradInfra)" stroke="#f48fb1" stroke-width="1"/>
  <text x="655" y="950" font-family="Segoe UI, sans-serif" font-size="10" fill="#546e7a">Infrastructure</text>

  <rect x="70" y="965" width="18" height="12" rx="3" fill="url(#gradPersist)" stroke="#80cbc4" stroke-width="1"/>
  <text x="95" y="975" font-family="Segoe UI, sans-serif" font-size="10" fill="#546e7a">Persistence</text>

  <!-- Flow description -->
  <text x="70" y="1005" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#37474f">Request Flow:</text>
  <text x="70" y="1022" font-family="Segoe UI, sans-serif" font-size="9" fill="#546e7a">① React Console → ② CORS/Security/Validation/RBAC → ③ Scenario Service &amp; Ports → ④ Pydantic Models &amp; Policy</text>
  <text x="70" y="1038" font-family="Segoe UI, sans-serif" font-size="9" fill="#546e7a">⑤ Rule Engine (default) OR LLM Engine (+ Retrieval) → ⑥ Safety Validation → ⑦ Persist to DB + AuditLog → ⑧ JSON Response</text>

  <text x="70" y="1060" font-family="Segoe UI, sans-serif" font-size="9" fill="#78909c" font-style="italic">Solid arrows = synchronous calls  ·  Dashed arrows = data/query flow  ·  All decisions are advisory-only with human approval required</text>
</svg>